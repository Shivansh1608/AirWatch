services:
  mongo:
    image: mongo:7-jammy
    container_name: airwatch_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: airwatch_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/airwatch
      - CLIENT_URL=http://localhost
      - JWT_ACCESS_SECRET=airwatch_super_secret_jwt_access_token_32chars_key_2026
      - JWT_REFRESH_SECRET=airwatch_super_secret_jwt_refresh_token_32chars_key_2026
      - COOKIE_SECRET=airwatch_secure_cookie_signing_secret_998877
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: airwatch_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
